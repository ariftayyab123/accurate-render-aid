sonar.projectKey=retained
sonar.sources=src
sonar.sourceEncoding=UTF-8

# Generated or vendored code we do not author or maintain by hand
sonar.exclusions=\
  src/routeTree.gen.ts,\
  src/integrations/supabase/**,\
  src/components/ui/**,\
  supabase/**,\
  public/**,\
  **/*.gen.ts

# Repetition in these files is structural (generated route trees, generated
# database typings, shadcn primitives, per-locale copy tables), not logic reuse.
sonar.cpd.exclusions=\
  src/routeTree.gen.ts,\
  src/integrations/supabase/**,\
  src/components/ui/**,\
  src/lib/site-copy.ts,\
  src/data/menu.ts,\
  **/*.gen.ts
